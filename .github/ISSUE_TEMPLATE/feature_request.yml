name: Feature request
description: Suggest something FabricationStation should do.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Other addons or manual steps.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recipes, quality or profit
        - Queue and shopping list
        - Crafting orders, customers or ledger
        - Characters or planner
        - Guild sharing
        - Chat requests
        - Settings or setup guide
        - Something else
    validations:
      required: true
